<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>KART RACING — Circuito Verde & Praia Tropical</title>
<style>
:root{ --verde:#3ddc55; --amarelo:#ffd23e; --vermelho:#ff4757; --azul:#2e9bff; --painel:rgba(10,22,40,.82); }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:"Arial Black","Segoe UI",Impact,system-ui,sans-serif;
  overscroll-behavior:none;position:fixed;inset:0}
#cv{position:fixed;inset:0;display:block;touch-action:none}
.hidden{display:none!important}
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center}
.btn{cursor:pointer;border:4px solid #06121f;color:#fff;background:linear-gradient(180deg,#37b457,#1d7a38);
  font-family:inherit;font-size:20px;letter-spacing:2px;padding:14px 34px;margin:7px;border-radius:14px;
  text-shadow:0 2px 0 #063;box-shadow:0 6px 0 #0a3d1c,0 10px 18px rgba(0,0,0,.5);transform:skewX(-6deg);transition:.12s;touch-action:manipulation}
.btn:hover{filter:brightness(1.15);transform:skewX(-6deg) translateY(-2px)}
.btn:active{transform:skewX(-6deg) translateY(3px);box-shadow:0 2px 0 #0a3d1c}
.btn.small{font-size:14px;padding:9px 18px}
.btn.blue{background:linear-gradient(180deg,#3aa0ff,#1a5fc4);box-shadow:0 6px 0 #0d3a7a,0 10px 18px rgba(0,0,0,.5)}
.btn.red{background:linear-gradient(180deg,#ff6b6b,#c62b3a);box-shadow:0 6px 0 #6e1220,0 10px 18px rgba(0,0,0,.5)}
.btn.yellow{background:linear-gradient(180deg,#ffd23e,#e09a00);color:#3a2400;text-shadow:0 1px 0 #ffe9a0;box-shadow:0 6px 0 #7a5200,0 10px 18px rgba(0,0,0,.5)}
.btn.sel{outline:4px solid #fff;filter:brightness(1.25)}
.checker{height:14px;width:100%;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0 0/22px 22px}
#menu .logo{font-size:min(11vw,86px);color:#fff;letter-spacing:4px;transform:skewX(-8deg);
  text-shadow:0 3px 0 #ffd23e,0 7px 0 #e09a00,0 12px 0 #7a3b00,0 18px 28px rgba(0,0,0,.7)}
#menu .logo span{color:var(--amarelo)}
#menu .sub{color:#cfeaff;margin:8px 0 26px;letter-spacing:6px;font-size:14px;text-shadow:0 2px 4px #000}
#menu .col{display:flex;flex-direction:column;align-items:center}
#menu .hint{position:absolute;bottom:24px;color:#ffffff66;font-size:11px;font-family:system-ui;text-align:center;padding:0 12px}
.panel{background:var(--painel);border:3px solid #28527a;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#select{justify-content:flex-start;padding:0}
#selTop{display:flex;gap:14px;padding:12px 14px;align-items:flex-start;width:100%;z-index:2}
#selTitle{flex:1;min-width:0}
#selName{font-size:32px;color:#fff;letter-spacing:2px;text-shadow:0 3px 0 #0007,0 6px 14px #000}
#selType{color:var(--amarelo);font-size:14px;letter-spacing:3px;margin-top:2px;text-shadow:0 2px 3px #000}
#selPerk{color:#9fd8ff;font-size:11px;font-family:system-ui;font-weight:bold;margin-top:4px}
#desc{color:#8fb8d8;font-size:11px;font-family:system-ui;margin-top:6px;max-width:440px}
#selStats{width:280px;background:var(--painel);border:3px solid #28527a;border-radius:14px;padding:12px 14px}
#selStage{flex:1;min-height:140px;width:100%}
#selBottom{display:flex;gap:14px;padding:12px 14px;align-items:stretch;width:100%;z-index:2}
#charGrid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px;align-content:start;max-height:180px;overflow-y:auto;padding:10px}
.chip{cursor:pointer;border:2px solid #16324e;border-radius:10px;padding:7px 3px;text-align:center;background:#122b44;color:#bfe0ff;font-size:10px;font-family:inherit;letter-spacing:.5px}
.chip .dot{width:26px;height:26px;border-radius:50%;margin:0 auto 4px;border:2px solid #fff3}
.chip.on{border-color:var(--amarelo);background:#1e4a2e;color:#fff;box-shadow:0 0 12px #ffd23e88}
#selActions{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--painel);border:3px solid #28527a;border-radius:14px;padding:12px 16px;min-width:230px}
#trackRow{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
#trackRow .btn{font-size:12px;padding:7px 12px;margin:2px}
#diffRow{display:flex;gap:5px}
.stat{margin:7px 0;font-size:11px;color:#cfeaff;letter-spacing:1px}
.stat .bar{height:12px;background:#0b1c30;border-radius:7px;border:2px solid #28527a;overflow:hidden}
.stat .fill{height:100%;background:linear-gradient(90deg,#3ddc55,#ffd23e);border-radius:4px}
#hud{position:fixed;inset:0;z-index:8;pointer-events:none;font-family:inherit}
.hbox{position:absolute;background:var(--painel);border:3px solid #28527a;border-radius:12px;color:#fff;padding:8px 16px;transform:skewX(-6deg);box-shadow:0 6px 16px rgba(0,0,0,.45)}
#hudLap{top:14px;left:14px;font-size:22px;letter-spacing:2px}
#hudPos{top:14px;right:14px;font-size:30px;color:var(--amarelo);letter-spacing:1px}
#mmBox{position:absolute;top:76px;right:14px;width:150px;height:150px;background:rgba(6,16,30,.75);border:3px solid #28527a;border-radius:12px;overflow:hidden}
#mm{width:100%;height:100%}
#hudItem{bottom:16px;left:50%;transform:translateX(-50%) skewX(-6deg);width:74px;height:74px;display:flex;align-items:center;justify-content:center;font-size:40px}
#hudItemName{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);color:#ffd23e;font-size:12px;letter-spacing:2px;text-shadow:0 2px 3px #000}
#hudSpd{bottom:16px;right:14px;text-align:right;min-width:150px}
#spdNum{font-size:34px;color:#fff}
#spdUnit{font-size:12px;color:#9fd8ff}
#spdBar{height:10px;background:#0b1c30;border:2px solid #28527a;border-radius:6px;margin-top:4px;overflow:hidden}
#spdFill{height:100%;width:0%;background:linear-gradient(90deg,#2e9bff,#3ddc55,#ffd23e,#ff4757)}
#driftBox{bottom:110px;right:14px;display:flex;gap:5px;padding:7px 10px}
.dseg{width:34px;height:12px;border:2px solid #28527a;border-radius:5px;background:#0b1c30}
#msg{position:fixed;top:20%;left:0;right:0;text-align:center;z-index:12;pointer-events:none;
  color:#fff;font-size:min(7vw,46px);letter-spacing:4px;text-shadow:0 3px 0 #000,0 8px 22px #000;opacity:0;transition:opacity .25s;transform:skewX(-6deg)}
#wrongWay{position:fixed;top:34%;left:0;right:0;text-align:center;z-index:12;color:#ff4757;font-size:30px;letter-spacing:3px;text-shadow:0 2px 0 #000;display:none;animation:blink .5s infinite}
@keyframes blink{50%{opacity:.15}}
#count{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:14;pointer-events:none;
  font-size:min(30vw,190px);color:#fff;text-shadow:0 6px 0 #e09a00,0 14px 34px #000;transform:skewX(-8deg)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:13;transition:opacity .35s}
.modal{position:fixed;inset:0;z-index:20;background:rgba(4,10,20,.72);display:flex;flex-direction:column;align-items:center;justify-content:center}
.modal .card{background:var(--painel);border:4px solid #28527a;border-radius:18px;padding:26px 34px;text-align:center;color:#fff;max-width:min(720px,94vw);max-height:92vh;overflow-y:auto}
.card h2{letter-spacing:4px;margin-bottom:16px;color:var(--amarelo);text-shadow:0 3px 0 #000}
#resTable{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
#resTable td,#resTable th{padding:6px 10px;border-bottom:1px solid #28527a55;text-align:left;color:#cfeaff}
#resTable tr.me td{color:#ffd23e}
#resTable td.pos{font-size:18px;color:#fff;width:44px}
.med1{color:#ffd700!important}.med2{color:#cfd8e6!important}.med3{color:#e0915a!important}
#touch{position:fixed;inset:0;z-index:9;pointer-events:auto;touch-action:none}
.tb{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none;
  border-radius:50%;border:3px solid rgba(255,255,255,.4);background:rgba(10,25,45,.55);color:#fff;
  font-family:inherit;touch-action:none;box-shadow:0 4px 12px rgba(0,0,0,.4);transition:transform .05s,background .05s}
.tb.on{background:rgba(80,220,130,.75);transform:scale(.92)}
#tL{left:10px;bottom:22px;width:70px;height:70px;font-size:26px}
#tR{left:88px;bottom:22px;width:70px;height:70px;font-size:26px}
#tG{right:10px;bottom:56px;width:90px;height:90px;font-size:15px;letter-spacing:1px;background:rgba(40,160,70,.6)}
#tB{right:16px;bottom:158px;width:58px;height:58px;font-size:11px;background:rgba(190,55,65,.55)}
#tD{right:118px;bottom:22px;width:70px;height:70px;font-size:12px;background:rgba(55,120,220,.55)}
#tI{right:124px;bottom:104px;width:58px;height:58px;font-size:11px;background:rgba(210,165,35,.6)}
#tPause{right:8px;top:8px;width:50px;height:50px;font-size:20px;border-radius:12px;pointer-events:auto;background:rgba(10,25,45,.6)}
#fps{position:fixed;left:8px;bottom:4px;color:#ffffff55;font-size:10px;z-index:5;font-family:monospace}
#err{position:fixed;left:8px;bottom:20px;right:8px;color:#ff8080;font-size:11px;z-index:99;font-family:monospace;display:none;background:#0008;padding:4px}
#dbg{position:fixed;top:70px;left:14px;z-index:15;color:#7CFC00;font:11px monospace;background:#000a;padding:8px;border-radius:8px;display:none;pointer-events:none;white-space:pre;line-height:1.5}
@media (max-width:820px){
  .btn{font-size:16px;padding:11px 26px}
  #menu .logo{font-size:13vw}
  #hudLap{top:8px;left:8px;font-size:14px;padding:5px 10px}
  #hudSpd{top:52px;left:8px;bottom:auto;right:auto;min-width:84px;padding:4px 10px;text-align:left}
  #spdNum{font-size:20px}
  #spdBar{margin-top:3px}
  #hudItem{top:8px;left:50%;bottom:auto;transform:translateX(-50%) skewX(-6deg);width:54px;height:54px;font-size:28px}
  #hudItemName{top:64px;bottom:auto;left:50%;transform:translateX(-50%);font-size:10px}
  #driftBox{top:82px;left:50%;bottom:auto;right:auto;transform:translateX(-50%);padding:5px 8px}
  #hudPos{top:64px;right:8px;font-size:18px;padding:4px 10px}
  #mmBox{top:110px;right:8px;width:74px;height:74px}
  #mm{width:74px;height:74px}
  #selTop{flex-direction:column;gap:6px;padding:8px 10px}
  #selName{font-size:22px}
  #selStats{width:100%;padding:8px 10px}
  #statBars{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
  #selStage{min-height:150px}
  #selBottom{flex-direction:column;gap:8px;padding:8px 10px}
  #charGrid{grid-template-columns:repeat(5,1fr);max-height:112px}
  #selActions{min-width:0;width:100%;flex-direction:row;flex-wrap:wrap;justify-content:center;padding:8px}
  #desc{display:none}
}
@media (max-height:520px){ #mmBox{display:none} #hudSpd{top:8px} #driftBox{top:48px} }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div class="hbox" id="hudLap">VOLTA 1/3</div>
  <div class="hbox" id="hudPos">8º/8</div>
  <div id="mmBox"><canvas id="mm" width="150" height="150"></canvas></div>
  <div class="hbox" id="hudItem"></div>
  <div id="hudItemName"></div>
  <div class="hbox" id="hudSpd"><span id="spdNum">0</span> <span id="spdUnit">km/h</span><div id="spdBar"><div id="spdFill"></div></div></div>
  <div class="hbox" id="driftBox"><div class="dseg" id="ds1"></div><div class="dseg" id="ds2"></div><div class="dseg" id="ds3"></div></div>
</div>
<div id="msg"></div><div id="wrongWay">⇆ SENTIDO CONTRÁRIO!</div>
<div id="count" class="hidden"></div><div id="flash"></div><div id="dbg"></div>

<div id="menu" class="screen">
  <div class="checker" style="position:absolute;top:0"></div>
  <div class="logo">KART<span>RACING</span></div>
  <div class="sub">★ CIRCUITO VERDE · PRAIA TROPICAL ★</div>
  <div class="col">
    <button class="btn yellow" id="btnJogar">JOGAR</button>
    <button class="btn" id="btnCamp">CAMPEONATO</button>
    <button class="btn" id="btnBat">BATALHA</button>
    <button class="btn" id="btnGar">GARAGEM</button>
    <button class="btn blue" id="btnConf">CONFIGURAÇÕES</button>
  </div>
  <div class="hint" id="menuHint">F3 = modo debug · ESPAÇO = drift · E = item</div>
  <div class="checker" style="position:absolute;bottom:0"></div>
</div>

<div id="select" class="screen hidden">
  <div id="selTop">
    <div id="selTitle">
      <div id="selName">VICTOR</div>
      <div id="selType"></div>
      <div id="selPerk"></div>
      <div id="desc"></div>
    </div>
    <div id="selStats"><div id="statBars"></div></div>
  </div>
  <div id="selStage"></div>
  <div id="selBottom">
    <div class="panel" id="charGrid"></div>
    <div id="selActions">
      <div id="trackRow">
        <button class="btn small blue track sel" data-track="0">🌿 CIRCUITO VERDE</button>
        <button class="btn small yellow track" data-track="1">🏖️ PRAIA TROPICAL</button>
      </div>
      <div id="diffRow">
        <button class="btn small" data-diff="facil">FÁCIL</button>
        <button class="btn small sel" data-diff="normal">NORMAL</button>
        <button class="btn small" data-diff="dificil">DIFÍCIL</button>
      </div>
      <button class="btn yellow" id="btnCorrer">CORRER! 🏁</button>
      <button class="btn small red" id="btnSelBack">◀ MENU</button>
    </div>
  </div>
</div>

<div id="pause" class="modal hidden"><div class="card">
  <h2>PAUSADO</h2>
  <button class="btn" id="btnResume">CONTINUAR</button><br>
  <button class="btn blue" id="btnRestart">REINICIAR</button><br>
  <button class="btn red" id="btnQuit">SAIR PARA O MENU</button>
</div></div>

<div id="results" class="modal hidden"><div class="card">
  <h2>🏁 RESULTADO</h2>
  <table id="resTable"></table>
  <button class="btn yellow" id="btnAgain">JOGAR NOVAMENTE</button>
  <button class="btn blue" id="btnResSel">ESCOLHER PERSONAGEM</button>
  <button class="btn red" id="btnResMenu">MENU PRINCIPAL</button>
</div></div>

<div id="soon" class="modal hidden"><div class="card">
  <h2 id="soonTitle">EM BREVE</h2>
  <p id="soonTxt" style="color:#9fd8ff;font-size:14px;font-family:system-ui;margin-bottom:18px"></p>
  <button class="btn small" id="btnSoonOk">OK</button>
</div></div>
<div id="settings" class="modal hidden"><div class="card">
  <h2>CONFIGURAÇÕES</h2>
  <button class="btn small blue" id="btnSom">SOM: LIGADO</button>
  <button class="btn small blue" id="btnSombra">SOMBRAS: LIGADO</button><br>
  <button class="btn small" id="btnSetBack">VOLTAR</button>
</div></div>

<div id="touch" class="hidden">
  <div class="tb" id="tPause">⏸</div>
  <div class="tb" id="tL">◀</div>
  <div class="tb" id="tR">▶</div>
  <div class="tb" id="tD">DRIFT</div>
  <div class="tb" id="tI">ITEM</div>
  <div class="tb" id="tB">FREIO</div>
  <div class="tb" id="tG">GÁS</div>
</div>
<div id="fps"></div><div id="err"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
addEventListener("error",e=>{const d=document.getElementById("err");if(d){d.style.display="block";d.textContent="ERRO: "+e.message+" (linha "+e.lineno+")";}});
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("dblclick",e=>e.preventDefault());

/* ================= CONSTANTES ================= */
const STEP=1/60, RAIL_LAT=14, OPEN_LAT=24, WT=28, RW=7.5, MAX_BOOST_SPEED=50, KART_R=1.3;
let DEBUG=false;

/* ================= UTILIDADES ================= */
const PI=Math.PI, TAU=PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const nAng=a=>{while(a>PI)a-=TAU;while(a<-PI)a+=TAU;return a};
const fmtT=t=>{if(t==null||!isFinite(t))return "--:--.-";const m=Math.floor(t/60),s=t-m*60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s.toFixed(2)};
const _MATS={};
function MAT(c,opts={}){const k=c+"|"+JSON.stringify(opts);if(_MATS[k])return _MATS[k];
  const m=new THREE.MeshLambertMaterial(Object.assign({color:c},opts));_MATS[k]=m;return m}
function canvasTex(w,h,fn){const c=document.createElement("canvas");c.width=w;c.height=h;
  const g=c.getContext("2d");fn(g,w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}
function box(w,h,d,c,x=0,y=0,z=0,parent=null){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),MAT(c));
  m.position.set(x,y,z);if(parent)parent.add(m);return m}
function mergeGeoms(list){let total=0;
 const ni=list.map(g=>{const n=g.index?g.toNonIndexed():g;total+=n.attributes.position.count;return n;});
 const pos=new Float32Array(total*3);let o=0;
 for(const g of ni){pos.set(g.attributes.position.array,o);o+=g.attributes.position.array.length;}
 const out=new THREE.BufferGeometry();out.setAttribute("position",new THREE.BufferAttribute(pos,3));
 out.computeVertexNormals();return out}

/* ================= DADOS ================= */
const TYPES={
1:{n:"VELOCISTA",v:10,a:7,c:5,f:4,d:6,g:5},
2:{n:"FOGUETE",v:8,a:10,c:7,f:3,d:7,g:6},
3:{n:"LEVE",v:7,a:9,c:10,f:2,d:9,g:8},
4:{n:"TANQUE",v:8,a:3,c:4,f:10,d:3,g:8},
5:{n:"EQUILIBRADO",v:7,a:7,c:7,f:7,d:7,g:7},
6:{n:"DRIFTER",v:7,a:7,c:9,f:4,d:10,g:9,perk:"Mestre do drift: carrega turbo muito mais rápido."},
7:{n:"BRUTAL",v:8,a:4,c:3,f:10,d:3,g:9},
8:{n:"TÉCNICO",v:7,a:8,c:10,f:5,d:8,g:10},
9:{n:"AGRESSIVO",v:8,a:6,c:6,f:8,d:6,g:6},
10:{n:"ADERENTE",v:7,a:8,c:9,f:4,d:8,g:10},
11:{n:"NITRO",v:7,a:7,c:6,f:4,d:7,g:6,perk:"Todos os boosts duram ~25% mais."},
12:{n:"COMPETIDOR",v:9,a:8,c:8,f:6,d:7,g:7},
13:{n:"TRATOR",v:7,a:3,c:3,f:10,d:2,g:10},
14:{n:"TRAPACEIRO",v:7,a:8,c:8,f:5,d:8,g:8,perk:"Perde ~50% menos velocidade fora da pista."},
15:{n:"ESPECIAL",v:9,a:9,c:9,f:6,d:9,g:9,perk:"Reservado para habilidade exclusiva futura."}};
const CHARS=[
{id:1,n:"VICTOR",type:1,skin:0xf2c9a0,hair:0x6b4a2f,shirt:0x232a36,col:0x111318,desc:"Velocista nato. O futuro chegou com barba feita."},
{id:2,n:"ANA",type:2,skin:0xffd9c0,hair:0xf7d26b,shirt:0xff8ac2,col:0xff7ab8,desc:"Princesa do foguete. Acelera como ninguém."},
{id:3,n:"J. RAFAEL",type:4,skin:0xb97a56,hair:0x2e2620,shirt:0xd8b13a,col:0x8a5a2b,desc:"Um tronco. Um destino. ZECA na lateral."},
{id:4,n:"NAYARA",type:3,skin:0xc68863,hair:0x17131a,shirt:0x2e6fd8,col:0x2e6fd8,desc:"Leve e ágil. A FAMÍLIA inteira na carona."},
{id:5,n:"JOÃO V.",type:7,skin:0xf0c8a0,hair:0x141414,shirt:0x19b7a0,col:0x12c2ad,desc:"Elétrico, brutal e de óculos quadrado."},
{id:6,n:"GIOVANNA",type:5,skin:0xffe0d0,hair:0x6f4a2a,shirt:0xff5d5d,col:0xf2f4f6,desc:"Pequena no tamanho, enorme no equilíbrio."},

const AU={ctx:null,master:null,eng:null,engG:null,eng2:null,skidG:null,started:false,lastHitS:0,
 init(){ if(this.ctx)return; const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
  const t=this.ctx=new C(); this.master=t.createGain(); this.master.gain.value=.42; this.master.connect(t.destination);
  this.eng=t.createOscillator(); this.eng.type="sawtooth";
  const lp=t.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=520;
  this.engG=t.createGain(); this.engG.gain.value=0;
  this.eng.connect(lp); lp.connect(this.engG); this.engG.connect(this.master); this.eng.start();
  this.eng2=t.createOscillator(); this.eng2.type="square";
  const g2=t.createGain(); g2.gain.value=.4; this.eng2.connect(g2); g2.connect(lp); this.eng2.start();
  const nb=t.createBuffer(1,t.sampleRate,t.sampleRate), d=nb.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=t.createBufferSource(); src.buffer=nb; src.loop=true;
  const bp=t.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=900; bp.Q.value=.8;
  this.skidG=t.createGain(); this.skidG.gain.value=0;
  src.connect(bp); bp.connect(this.skidG); this.skidG.connect(this.master); src.start();
  this.started=true; },
 resume(){ if(this.ctx&&this.ctx.state==="suspended")this.ctx.resume(); },
 ok(){ return this.started&&settings.som; },
 engine(ratio,thr,boost){ if(!this.ok())return; const t=this.ctx.currentTime;
  const f=68+ratio*165+(boost?55:0);
  this.eng.frequency.setTargetAtTime(f,t,.05); this.eng2.frequency.setTargetAtTime(f*.5,t,.05);
  this.engG.gain.setTargetAtTime(.045+thr*.1+(boost?.05:0),t,.09); },
 engineOff(){ if(!this.started)return; this.engG.gain.setTargetAtTime(0,this.ctx.currentTime,.1); },
 skid(on){ if(!this.ok())return; this.skidG.gain.setTargetAtTime(on?.22:0,this.ctx.currentTime,.06); },
 beep(f=440,d=.12,type="square",v=.3){ if(!this.ok())return; const t=this.ctx;
  const o=t.createOscillator(),g=t.createGain(); o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(v,t.currentTime); g.gain.exponentialRampToValueAtTime(.001,t.currentTime+d);
  o.connect(g); g.connect(this.master); o.start(); o.stop(t.currentTime+d); },
 noise(d=.3,f=800,v=.4){ if(!this.ok())return; const t=this.ctx;
  const b=t.createBuffer(1,t.sampleRate*d,t.sampleRate),dd=b.getChannelData(0);
  for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*(1-i/dd.length);
  const s=t.createBufferSource(); s.buffer=b; const bp=t.createBiquadFilter(); bp.type="lowpass"; bp.frequency.value=f;
  const g=t.createGain(); g.gain.value=v; s.connect(bp); bp.connect(g); g.connect(this.master); s.start(); },
 boom(){ this.noise(.5,600,.6); this.beep(90,.4,"sine",.5); },
 pickup(){ this.beep(880,.08,"square",.22); this.beep(1320,.1,"square",.18); },
 use(){ this.beep(660,.1,"triangle",.3); },
 thunder(){ this.noise(.7,300,.55); this.beep(60,.6,"sine",.4); },
 hit(strong){ const n=performance.now(); if(n-this.lastHitS<220)return; this.lastHitS=n;
  this.noise(strong?.22:.12,strong?500:800,strong?.4:.22); },
 fanfare(win){ const seq=win?[523,659,784,1046,1318]:[392,330,262,196];
  seq.forEach((f,i)=>setTimeout(()=>this.beep(f,.22,"square",.28),i*160)); }};

const isTouch=("ontouchstart" in window)||navigator.maxTouchPoints>0||(window.matchMedia&&matchMedia("(pointer:coarse)").matches);
function bindTouchControls(){
 const layer=document.getElementById("touch"); if(!layer)return;
 const map={ tL:"left", tR:"right", tG:"gas", tB:"brake", tD:"drift", tI:"item" };
 const held={};
 function buttonAt(x,y){ for(const id in map){ const el=document.getElementById(id); if(!el)continue;
   const r=el.getBoundingClientRect();
   if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return map[id]; } return null; }
 function setOn(id,on){ const el=document.getElementById(id); if(el)el.classList.toggle("on",on); }
 function recompute(){ const st={left:false,right:false,gas:false,brake:false,drift:false};
  for(const pid in held){ const p=held[pid]; if(p&&Object.prototype.hasOwnProperty.call(st,p))st[p]=true; }
  input.left=st.left; input.right=st.right; input.gas=st.gas; input.brake=st.brake; input.drift=st.drift;
  setOn("tL",st.left); setOn("tR",st.right); setOn("tG",st.gas); setOn("tB",st.brake); setOn("tD",st.drift); }
 function flash(id){ setOn(id,true); setTimeout(()=>setOn(id,false),160); }
 if(window.PointerEvent){
  function onDown(e){ e.preventDefault(); AU.init(); AU.resume();
   const hit=buttonAt(e.clientX,e.clientY); if(!hit)return;
   if(hit==="item"){ input.itemQ=true; flash("tI"); return; }
   held[e.pointerId]=hit; recompute(); }
  function onMove(e){ if(held[e.pointerId]===undefined)return;
   const hit=buttonAt(e.clientX,e.clientY);
   if(hit!==held[e.pointerId]){ if(hit==="item"){ delete held[e.pointerId]; input.itemQ=true; flash("tI"); }
    else held[e.pointerId]=hit; recompute(); } }
  function onUp(e){ if(held[e.pointerId]===undefined)return; delete held[e.pointerId]; recompute(); }
  layer.addEventListener("pointerdown",onDown);
  layer.addEventListener("pointermove",onMove);
  layer.addEventListener("pointerup",onUp);
  layer.addEventListener("pointercancel",onUp);
 } else {
  function tDown(e){ e.preventDefault(); AU.init(); AU.resume();
   for(const t of e.changedTouches){ const hit=buttonAt(t.clientX,t.clientY);
    if(hit==="item"){ input.itemQ=true; flash("tI"); }
    else if(hit){ held[t.identifier]=hit; } } recompute(); }
  function tUp(e){ for(const t of e.changedTouches){ delete held[t.identifier]; } recompute(); }
  layer.addEventListener("touchstart",tDown,{passive:false});
  layer.addEventListener("touchend",tUp,{passive:false});
  layer.addEventListener("touchcancel",tUp,{passive:false});
 }
 layer.addEventListener("contextmenu",e=>e.preventDefault());
 const pb=document.getElementById("tPause");
 if(pb){ const h=e=>{ e.preventDefault(); e.stopPropagation(); AU.init(); AU.resume(); togglePause(); };
  pb.addEventListener("pointerdown",h);
  if(!window.PointerEvent)pb.addEventListener("touchstart",h,{passive:false}); }
}
if(isTouch)bindTouchControls();

const idxNear=(x,z)=>{let bi=0,bd=1e9;for(let i=0;i<N;i++){const dx=S[i].p.x-x,dz=S[i].p.z-z,d=dx*dx+dz*dz;if(d<bd){bd=d;bi=i}}return bi};
function addTrauma(v){ trauma=Math.min(.55,trauma+v); }

function buildSamples(cp){
 S=[];
 const pts=cp.map(p=>new THREE.Vector3(p[0],p[2],p[1]));
 const curve=new THREE.CatmullRomCurve3(pts,true,"catmullrom",.55);
 const raw=curve.getSpacedPoints(N);
 for(let i=0;i<N;i++){ const p=raw[i]; const a=raw[(i-1+N)%N], b=raw[(i+1)%N];
  const t3=new THREE.Vector3().subVectors(b,a).normalize();
  const th=new THREE.Vector3(t3.x,0,t3.z); if(th.lengthSq()>0)th.normalize();
  S.push({p:new THREE.Vector3(p.x,p.y,p.z),t:t3,th,n:new THREE.Vector3(-th.z,0,th.x),curv:0}); }
 for(let i=0;i<N;i++){ const t1=S[(i-1+N)%N].th,t2=S[(i+1)%N].th;
  S[i].curv=t1.x*t2.z-t1.z*t2.x; }
}
function placeFeatures(def){
 TRACK.zones=[];TRACK.ramps=[];TRACK.pads=[];TRACK.sand=[];TRACK.bridges=[];TRACK.boxes=[];TRACK.obstacles=[];TRACK.wallP=[];TRACK.wallN=[];
 window.CONES=[];
 for(let i=0;i<N;i++){TRACK.wallP.push(true);TRACK.wallN.push(true);}
 if(def.shortcut){
  const gA=idxNear(def.shortcut.gA[0],def.shortcut.gA[1]);
  const gB=idxNear(def.shortcut.gB[0],def.shortcut.gB[1]);
  const P={x:def.shortcut.P[0],z:def.shortcut.P[1]};
  const mid=(gA+Math.floor(((gB-gA+N)%N)/2))%N;
  const latMid=(P.x-S[mid].p.x)*S[mid].n.x+(P.z-S[mid].p.z)*S[mid].n.z;
  const openSide=latMid>0?1:-1;
  for(let j=0;j<=((gB-gA+N)%N);j++){ const i=(gA+j)%N;
   if(openSide>0)TRACK.wallP[i]=false; else TRACK.wallN[i]=false; } }
 for(const z of def.zones){ let x,zc;
  if(z.at){ const s=S[idxNear(z.at[0],z.at[1])]; x=s.p.x+s.n.x*z.lat; zc=s.p.z+s.n.z*z.lat; }
  else { x=z.x; zc=z.z; }
  TRACK.zones.push({x,z:zc,r:z.r,type:z.surf}); }
 for(const r of def.ramps)TRACK.ramps.push({x:r.x,z:r.z,r:r.r,pow:r.pow});
 for(const p of def.pads){ const i0=idxNear(p.x,p.z); TRACK.pads.push({i0,i1:(i0+p.len)%N}); }
 for(const s of def.sand){ const i0=idxNear(s.x,s.z); TRACK.sand.push({i0,i1:(i0+s.len)%N}); }
 for(const b of def.bridges){ const i0=idxNear(b.x,b.z); TRACK.bridges.push({i0,i1:(i0+b.len)%N}); }
 for(const b of def.boxes){ const i=idxNear(b.x,b.z),s=S[i];
  const lats=b.lats||[-4.5,-1.5,1.5,4.5];
  for(const lat of lats){ const p=s.p.clone().addScaledVector(s.n,lat); p.y+=1.15;
   TRACK.boxes.push({pos:p,active:true,t:0}); } }
 for(const r of def.rocks){ const s=S[idxNear(r.at[0],r.at[1])];
  const x=s.p.x+s.n.x*r.lat, z=s.p.z+s.n.z*r.lat;
  TRACK.obstacles.push({x,z,r:1.25,y:s.p.y,lastHit:-9}); }
 const coneStyle=def.theme.cone||"cone";
 for(const c of def.cones){ const s=S[idxNear(c.at[0],c.at[1])];
  const x=s.p.x+s.n.x*c.lat, z=s.p.z+s.n.z*c.lat;
  let m;
  if(coneStyle==="buoy"){
   m=new THREE.Group();
   const body=new THREE.Mesh(new THREE.SphereGeometry(.45,10,8),MAT(0xff5d5d)); m.add(body);
   const band=new THREE.Mesh(new THREE.TorusGeometry(.45,.08,6,14),MAT(0xffffff)); band.rotation.x=PI/2; m.add(band);
   m.position.set(x,s.p.y+.5,z);
  } else {
   m=new THREE.Mesh(new THREE.ConeGeometry(.35,.9,8),MAT(0xff7a1a));
   m.position.set(x,s.p.y+.45,z);
  }
  raceScene.add(m);
  CONES.push({x,z,mesh:m,active:true,t:0}); }
}

    for(const k of karts){ k.locked=false;
     if(!k.isPlayer)k.lockDelay=k.ai.react[0]+Math.random()*(k.ai.react[1]-k.ai.react[0]); }
    if(input.gas){ grantBoost(player,1.1,8); showMsg("LARGADA PERFEITA!",1100); }
    setTimeout(()=>{el.classList.add("hidden");el.style.color="";el.dataset.go="";},700); } }
  else el.textContent="";
 }
 if(state==="race"||state==="over"){ raceTime+=dt;
  if(player){
   if(!player.finished){
    player.throttle=input.gas?1:0; player.brake=input.brake?1:0;
    player.steerVal=(input.left?-1:0)+(input.right?1:0);
    player.driftBtn=input.drift;
    if(input.itemQ)useItem(player);
   } else driveAI(player,dt); }
  input.itemQ=false;
  for(const k of karts){
   if(k.lockDelay>0){ k.lockDelay-=dt; k.locked=k.lockDelay>0; }
   if(!k.isPlayer)driveAI(k,dt); }
  for(const k of karts){ k.ppx=k.pos.x;k.ppy=k.pos.y;k.ppz=k.pos.z;k.pph=k.h; }
  for(const k of karts)physKart(k,dt);
  kartCollisions(dt);
  updateItems(dt);
  for(const k of karts)updateProgress(k);
  computeRanks();
  if(resultsT>0){ resultsT-=dt;
   if(resultsT<=0&&state==="race"){ state="over"; buildResults(); show("results",true); show("touch",false); AU.skid(false); } }
 }
}

/* ================= CÂMERA ================= */
const camPos=new THREE.Vector3(),lookPos=new THREE.Vector3(); let camInit=false;
function updateCamera(dt,now){
 const k=player; if(!k)return;
 const fx=Math.sin(k.h),fz=Math.cos(k.h);
 const spdR=Math.abs(k.speed)/k.st.top;
 const dist=7.4+spdR*3+(k.boostT>0?1:0)+Math.max(0,k.vy)*.1;
 const desired=new THREE.Vector3(k.pos.x-fx*dist,k.pos.y+3.1+spdR*.6,k.pos.z-fz*dist);
 desired.y=Math.max(desired.y,S[k.idx].p.y+1.2);
 if(!camInit){camPos.copy(desired);lookPos.copy(k.pos);camInit=true;}
 camPos.lerp(desired,1-Math.exp(-dt*4.2));
 lookPos.lerp(new THREE.Vector3(k.pos.x+fx*7,k.pos.y+1.7,k.pos.z+fz*7),1-Math.exp(-dt*6.5));
 trauma=Math.max(0,trauma-dt*2.2);
 const amp=trauma*trauma*.4, t2=now*.001;
 const ox=Math.sin(t2*47)*amp, oy=Math.cos(t2*39)*amp*.7, oz=Math.sin(t2*31)*amp;
 cam.position.set(camPos.x+ox,camPos.y+oy,camPos.z+oz);
 cam.lookAt(lookPos);
 const targetFov=62+spdR*8+(k.boostT>0?5:0);
 cam.fov+=(targetFov-cam.fov)*Math.min(1,dt*5); cam.updateProjectionMatrix();
 sun.position.set(k.pos.x+50,90,k.pos.z+30); sun.target.position.copy(k.pos);
}

/* ================= HUD / MINIMAPA ================= */
const $=id=>document.getElementById(id);
let mmBase=null,mmPts=null;
function buildMinimapBase(){
 const pad=12,size=150;
 let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
 for(const s of S){ minX=Math.min(minX,s.p.x);maxX=Math.max(maxX,s.p.x);minZ=Math.min(minZ,s.p.z);maxZ=Math.max(maxZ,s.p.z); }
 const sc=Math.min((size-pad*2)/(maxX-minX),(size-pad*2)/(maxZ-minZ));
 mmPts=p=>[(p.x-minX)*sc+pad,(p.z-minZ)*sc+pad];
 const c=document.createElement("canvas"); c.width=c.height=size; const g=c.getContext("2d");
 g.strokeStyle="#0a1626"; g.lineWidth=8; g.beginPath();
 S.forEach((s,i)=>{const pt=mmPts(s.p); i?g.lineTo(pt[0],pt[1]):g.moveTo(pt[0],pt[1]);}); g.closePath(); g.stroke();
 g.strokeStyle="#cfeaff"; g.lineWidth=4; g.stroke();
 const f=mmPts(S[FIN].p); g.fillStyle="#ffd23e"; g.fillRect(f[0]-3,f[1]-3,6,6);
 mmBase=c; }
function drawMinimap(){
 const c=$("mm"),g=c.getContext("2d");
 g.clearRect(0,0,150,150); g.drawImage(mmBase,0,0);
 for(const k of karts){ const pt=mmPts(k.pos);
  if(k.isPlayer){ g.fillStyle="#fff"; g.beginPath(); g.arc(pt[0],pt[1],5,0,TAU); g.fill();
   g.strokeStyle="#ffd23e"; g.lineWidth=2; g.beginPath(); g.arc(pt[0],pt[1],7,0,TAU); g.stroke(); }
  else { g.fillStyle="#ff5d5d"; g.beginPath(); g.arc(pt[0],pt[1],3.2,0,TAU); g.fill(); } } }
let lastLapTxt="",lastPosTxt="",lastItem="";
function updateHUD(){
 const k=player; if(!k)return;
 const lt="VOLTA "+Math.min(k.lap+1,3)+"/3";
 if(lt!==lastLapTxt){$("hudLap").textContent=lt;lastLapTxt=lt;}
 const pt=k.rank+"º/8";
 if(pt!==lastPosTxt){$("hudPos").textContent=pt;lastPosTxt=pt;}
 const it=k.item?ITEM_ICON[k.item]:"";
 if(it!==lastItem){ $("hudItem").textContent=it; $("hudItemName").textContent=k.item?ITEM_NAME[k.item]:""; lastItem=it; }
 $("spdNum").textContent=Math.abs(Math.round(k.speed*3.4));
 $("spdFill").style.width=Math.min(100,Math.abs(k.speed)/MAX_BOOST_SPEED*100)+"%";
 $("spdFill").style.background=k.boostT>0?"linear-gradient(90deg,#ff7a1a,#ffd23e)":"";
 const frac=clamp(k.charge/L3,0,1), lvl=k.charge>=L3?3:k.charge>=L2?2:k.charge>=L1?1:0;
 const cols=["","#ffe14d","#ff8c1a","#4db8ff"];
 for(let i=1;i<=3;i++){ const el=$("ds"+i);
  const seg=clamp(frac*3-(i-1),0,1);
  el.style.background=seg>0?cols[Math.max(lvl,1)]:"#0b1c30";
  el.style.borderColor=lvl===3?"#4db8ff":"#28527a"; }
 $("wrongWay").style.display=k.wrongT>1.1?"block":"none";
 drawMinimap(); }
function showMsg(txt,ms=1200){ const m=$("msg"); m.textContent=txt; m.style.opacity=1;
 clearTimeout(msgT); msgT=setTimeout(()=>m.style.opacity=0,ms); }
let fpsV=60;
function updateDebug(){
 if(!DEBUG||!player)return;
 const k=player;
 $("dbg").textContent=
  "FPS: "+Math.round(fpsV)+"  PISTA: "+TRACKS[currentTrack].name+
  "\npos: "+k.pos.x.toFixed(1)+", "+k.pos.y.toFixed(1)+", "+k.pos.z.toFixed(1)+
  "\nvel: "+(k.speed*3.4).toFixed(0)+" km/h  vy: "+k.vy.toFixed(1)+
  "\nsurf: "+k.surface+"  idx: "+k.idx+"  grounded: "+k.grounded+
  "\nstuck: "+k.stuckT.toFixed(1)+" (stage "+k.stage+")  recover: "+k.recoverT.toFixed(1)+
  "\nnextCp: "+k.nextCp+"  lap: "+k.lap+"  rank: "+k.rank+
  "\ndrift: "+(k.drifting?"SIM":"não")+"  charge: "+k.charge.toFixed(1)+
  "\nboost: "+k.boostT.toFixed(1)+"  inv: "+k.respawnInv.toFixed(1); }

/* ================= TELAS ================= */
function show(id,on){ $(id).classList.toggle("hidden",!on); }
function toMenu(){ clearRace(); state="menu"; show("menu",true); show("select",false); show("hud",false);
 show("results",false); show("pause",false); show("touch",false); AU.engineOff(); }
function toSelect(){ clearRace(); state="select"; show("menu",false); show("select",true); show("hud",false);
 show("results",false); show("touch",false); AU.engineOff();
 initSelectScene(); selectChar(selChar); }
function resetRaceDynamics(){
 for(const b of TRACK.boxes){b.active=true;b.t=0;}
 for(let i=0;i<boxMeshes.length;i++)boxMeshes[i].visible=true;
 for(const c of CONES){c.active=true;c.mesh.visible=true;}
}
function startRace(){
 clearRace();
 if(selTrack!==currentTrack)buildWorld(selTrack);
 resetRaceDynamics();
 for(const k in input)input[k]=false;
 raceTime=0; resultsT=-1; trauma=0; camInit=false; acc=0;
 const others=CHARS.filter(c=>c.id!==selChar).sort(()=>Math.random()-.5).slice(0,7);
 const order=[...others,CHARS.find(c=>c.id===selChar)];
 order.forEach((ch,slot)=>{ const isP=ch.id===selChar;
  const k=makeKart(ch,isP,slot,settings.diff); karts.push(k); if(isP)player=k; });
 computeRanks();
 state="count"; cdT=0; lastLapTxt="";lastPosTxt="";lastItem="";
 show("select",false); show("menu",false); show("results",false); show("pause",false);
 show("hud",true); show("count",true);
 if(isTouch)show("touch",true);
 const el=$("count"); el.textContent=""; el.style.color=""; el.dataset.go="";
 showMsg(TRACKS[selTrack].icon+" "+TRACKS[selTrack].name,1600);
 updateCamera(1,performance.now()); }
function togglePause(){
 if(state==="race"||state==="count"){ pausedFrom=state; state="paused"; show("pause",true); AU.engineOff(); AU.skid(false); }
 else if(state==="paused"){ state=pausedFrom||"race"; show("pause",false); } }
function buildResults(){
 const sorted=[...karts].sort((a,b)=>{
  if(a.finished&&b.finished)return a.finTime-b.finTime;
  if(a.finished)return -1; if(b.finished)return 1; return b.prog-a.prog; });
 let html="<tr><th>POS</th><th>PILOTO</th><th>TEMPO</th><th>MELHOR VOLTA</th></tr>";
 sorted.forEach((k,i)=>{
  let t=k.finTime;
  if(t==null)t=raceTime+(3*N-k.prog)/26;
  const medal=i===0?"med1":i===1?"med2":i===2?"med3":"";
  html+="<tr class=\""+(k.isPlayer?"me":"")+"\"><td class=\"pos "+medal+"\">"+(i+1)+"º</td>"+
   "<td>"+k.ch.n+" <span style=\"color:#6fa\">· "+TYPES[k.ch.type].n+"</span></td>"+
   "<td>"+fmtT(t)+"</td><td>"+fmtT(k.bestLap)+"</td></tr>"; });
 $("resTable").innerHTML=html; }
const previews={};
function frameSelectCamera(){
 const aspect=W/H;
 if(aspect<1){ cam.fov=52; cam.position.set(3.2,2.0,4.6); }
 else { cam.fov=40; cam.position.set(2.6,1.7,3.8); }
 cam.updateProjectionMatrix();
 cam.lookAt(0,0.9,0);
}
function initSelectScene(){
 if(!selScene){
  selScene=new THREE.Scene(); selScene.background=new THREE.Color(0x16283f);
  selScene.add(new THREE.HemisphereLight(0xcfe8ff,0x223a55,1.05));
  const key=new THREE.DirectionalLight(0xfff2d8,1.1); key.position.set(4,7,5); selScene.add(key);
  const rim=new THREE.DirectionalLight(0x66aaff,.6); rim.position.set(-5,3,-4); selScene.add(rim);
  const ped=new THREE.Mesh(new THREE.CylinderGeometry(2.4,2.8,.5,24),MAT(0x28527a));
  ped.position.y=-.25; selScene.add(ped);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(2.55,.08,8,40),MAT(0xffd23e));
  ring.rotation.x=PI/2; ring.position.y=.05; selScene.add(ring);
  selTurn=new THREE.Group(); selScene.add(selTurn);
 }
 frameSelectCamera();
}
function selectChar(id){
 selChar=id;
 document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",+c.dataset.id===id));
 const ch=CHARS.find(c=>c.id===id), t=TYPES[ch.type];
 $("selName").textContent=ch.n;
 $("selType").textContent="TIPO "+ch.type+" — "+t.n;
 $("selPerk").textContent=t.perk||"";
 $("desc").textContent=ch.desc;
 const names=["VELOCIDADE","ACELERAÇÃO","CONTROLE","FORÇA","DRIFT","ADERÊNCIA"];
 const vals=[t.v,t.a,t.c,t.f,t.d,t.g];
 $("statBars").innerHTML=names.map((n,i)=>
  "<div class=\"stat\">"+n+"<div class=\"bar\"><div class=\"fill\" style=\"width:"+vals[i]*10+"%\"></div></div></div>").join("");
 if(!previews[id]){ previews[id]=buildKartVisual(ch); }
 previews[id].g.rotation.set(0,0,0);
 while(selTurn.children.length)selTurn.remove(selTurn.children[0]);
 selTurn.add(previews[id].g); }
function buildGrid(){
 const gEl=$("charGrid");
 CHARS.forEach(ch=>{ const b=document.createElement("button"); b.className="chip"; b.dataset.id=ch.id;
  b.innerHTML="<div class=\"dot\" style=\"background:#"+ch.col.toString(16).padStart(6,"0")+"\"></div>"+ch.n+"<br><span style=\"opacity:.6\">T"+ch.type+"</span>";
  b.onclick=()=>{AU.init();AU.beep(700,.05,"square",.15);selectChar(ch.id);};
  gEl.appendChild(b); }); }
function bindUI(){
 buildGrid();
 const soon=(t,x)=>{ $("soonTitle").textContent=t; $("soonTxt").textContent=x; show("soon",true); };
 $("btnJogar").onclick=()=>{AU.init();AU.resume();toSelect();};
 $("btnCamp").onclick=()=>soon("CAMPEONATO — EM BREVE","Copa Bronze · Copa Prata · Copa Ouro · Copa Especial. Múltiplas pistas te esperam!");
 $("btnBat").onclick=()=>soon("BATALHA — EM BREVE","Arena fechada, itens, pontos e eliminação!");
 $("btnGar").onclick=()=>soon("GARAGEM — EM BREVE","Personalize seus karts e conquistas.");
 $("btnConf").onclick=()=>show("settings",true);
 $("btnSom").onclick=e=>{ settings.som=!settings.som; e.target.textContent="SOM: "+(settings.som?"LIGADO":"DESLIGADO"); };
 $("btnSombra").onclick=e=>{ settings.sombras=!settings.sombras;
  renderer.shadowMap.enabled=settings.sombras; e.target.textContent="SOMBRAS: "+(settings.sombras?"LIGADO":"DESLIGADO"); };
 $("btnSetBack").onclick=()=>show("settings",false);
 $("btnSoonOk").onclick=()=>show("soon",false);
 $("btnSelBack").onclick=toMenu;
 $("btnCorrer").onclick=()=>{AU.init();AU.resume();startRace();};
 document.querySelectorAll("[data-diff]").forEach(b=>b.onclick=()=>{
  settings.diff=b.dataset.diff;
  document.querySelectorAll("[data-diff]").forEach(x=>x.classList.toggle("sel",x===b));
  AU.beep(600,.06,"square",.15); });
 document.querySelectorAll("[data-track]").forEach(b=>b.onclick=()=>{
  selTrack=+b.dataset.track;
  document.querySelectorAll("[data-track]").forEach(x=>x.classList.toggle("sel",x===b));
  AU.beep(760,.06,"square",.15); });
 $("btnResume").onclick=togglePause;
 $("btnRestart").onclick=()=>{show("pause",false);startRace();};
 $("btnQuit").onclick=()=>{show("pause",false);toMenu();};
 $("btnAgain").onclick=startRace;
 $("btnResSel").onclick=toSelect;
 $("btnResMenu").onclick=toMenu;
 addEventListener("keydown",e=>{ if(state!=="select")return;
  if(e.code==="ArrowRight")selectChar(selChar%15+1);
  if(e.code==="ArrowLeft")selectChar((selChar+13)%15+1);
  if(e.code==="Enter")startRace(); }); }

/* ================= LOOP ================= */
let lastT=performance.now(),fpsAcc=0,fpsN=0;
function syncKartMesh(k,alpha){
 const x=k.ppx+(k.pos.x-k.ppx)*alpha, y=k.ppy+(k.pos.y-k.ppy)*alpha, z=k.ppz+(k.pos.z-k.ppz)*alpha;
 const h=k.pph+nAng(k.h-k.pph)*alpha;
 k.g.position.set(x,y,z);
 const sNow=S[k.idx];
 const slope=Math.asin(clamp(sNow.t.y,-1,1));
 const spinning=k.spinT>0;
 const tPitch=k.grounded?-slope:clamp(-k.vy*.03,-.3,.3);
 const tRoll=k.drifting?-k.driftDir*.16:-(k.steerVal||0)*.06;
 k.vPitch+=(tPitch-k.vPitch)*.2; k.vRoll+=(tRoll-k.vRoll)*.2;
 k.g.rotation.set(clamp(k.vPitch,-.35,.35), h+(k.drifting?k.driftDir*.42:(k.steerVal||0)*.05)+(spinning?k.spinAng:0), clamp(k.vRoll,-.25,.25));
 const ts=k.slowT>0?.62:1;
 k.g.scale.x+=(ts-k.g.scale.x)*.15;
 k.g.scale.y+=((k.slowT>0?.5:1)-k.g.scale.y)*.15;
 k.g.scale.z=k.g.scale.x;
 for(const w of k.wheels)w.rotation.x=k.wheelSpin;
 for(const f of k.fronts)f.rotation.y=(k.drifting?k.driftDir*.5:-(k.steerVal||0)*.45);
 k.shield.visible=k.shieldT>0;
 if(k.shieldT>0)k.shield.scale.setScalar(1+Math.sin(performance.now()*.008)*.06); }
function continuousFX(k,dt){
 if(k.drifting){ const lvl=k.charge>=L3?3:k.charge>=L2?2:1;
  const cc=lvl===3?0x4db8ff:lvl===2?0xff8c1a:0xffe14d;
  if(Math.random()<dt*40){ spawnP(k.pos.x-Math.sin(k.h)*1.1+rnd(-.5,.5),k.pos.y+.25,k.pos.z-Math.cos(k.h)*1.1+rnd(-.5,.5),
   rnd(-1,1),rnd(.5,2),rnd(-1,1),cc,.35);
  spawnP(k.pos.x-Math.sin(k.h)*1.1,k.pos.y+.2,k.pos.z-Math.cos(k.h)*1.1,rnd(-2,2),rnd(1,3),rnd(-2,2),0x9aa0a8,.5); } }
 if((k.boostT>0||k.padT>0)&&Math.random()<dt*50){
  const fx=Math.sin(k.h),fz=Math.cos(k.h);
  spawnP(k.pos.x-fx*1.4,k.pos.y+.45,k.pos.z-fz*1.4,-fx*4+rnd(-1,1),rnd(.5,2),-fz*4+rnd(-1,1),
   Math.random()<.5?0xff7a1a:0xffd23e,.35); }
 if(k.grounded&&k.surface!=="road"&&Math.abs(k.speed)>6&&Math.random()<dt*30)
  spawnP(k.pos.x,k.pos.y+.2,k.pos.z,rnd(-1.5,1.5),rnd(1,2.5),rnd(-1.5,1.5),
   k.surface==="sand"?0xe0c97f:k.surface==="mud"?0x5d4a2f:0x6f9e5a,.55); }
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min(.1,(now-lastT)/1000); lastT=now;
 fpsAcc+=dt; fpsN++; if(fpsAcc>=.5){ fpsV=fpsN/fpsAcc; $("fps").textContent=Math.round(fpsV)+" fps"; fpsAcc=0;fpsN=0; }
 if(state==="menu"){
  const a=now*.00006;
  cam.position.set(5+Math.cos(a)*165,80,-35+Math.sin(a)*165);
  cam.lookAt(5,4,-35); cam.fov=60; cam.updateProjectionMatrix();
  animateScenery(dt);
  renderer.render(raceScene,cam);
 }
 else if(state==="select"){
  if(selTurn)selTurn.rotation.y+=dt*.9;
  renderer.render(selScene,cam);
 }
 else if(state==="count"||state==="race"||state==="over"){
  acc+=dt; let steps=0;
  while(acc>=STEP&&steps<4){ simStep(STEP); acc-=STEP; steps++; }
  if(steps===4)acc=0;
  const alpha=clamp(acc/STEP,0,1);
  for(const k of karts){ syncKartMesh(k,alpha); continuousFX(k,dt); }
  AU.skid(player&&player.drifting);
  if(player)AU.engine(Math.abs(player.speed)/player.st.top,player.throttle,player.boostT>0);
  animateScenery(dt);
  updateParticles(dt);
  updateCamera(dt,now);
  updateHUD();
  updateDebug();
  renderer.render(raceScene,cam);
 }
 else if(state==="paused"){ renderer.render(raceScene,cam); }
}
function animateScenery(dt){
 for(const c of clouds){ c.position.x+=dt*2; if(c.position.x>320)c.position.x=-320; }
 flagMeshes.forEach((f,i)=>f.rotation.y=Math.sin(performance.now()*.003+i)*0.6);
 if(waterMat){ waterMat.map.offset.x+=dt*0.03; waterMat.map.offset.y+=dt*0.012; }
}

function boot(){
 try{ initThree(); }catch(e){ document.body.innerHTML="<h1 style='color:#fff;padding:40px'>Seu navegador não suporta WebGL.</h1>"; return; }
 initParticles();
 buildWorld(0);
 bindUI();
 if(isTouch){ const h=document.getElementById("menuHint");
  if(h)h.textContent="Toque em JOGAR · use os botões na tela para acelerar, virar e driftar"; }
 toMenu();
 requestAnimationFrame(animate);
}
boot();
</script>
